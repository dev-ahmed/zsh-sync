[project]
name = "zsh-sync"
version = "0.1.0"
description = "Back up zsh dotfiles to the devSSD, sync changes incrementally, and restore them if the machine loses them."
authors = [{name = "Ahmed", email = "dev-ahmed@example.com"}]
license = {text = "MIT"}
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "typer[all]>=0.12.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "mypy>=1.11",
    "black>=24.0",
    "ruff>=0.6",
]

[project.scripts]
zs = "zsh_sync.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["zsh_sync"]

[tool.black]
line-length = 100
target-version = ['py310']

[tool.ruff]
line-length = 100

[tool.pytest.ini_options]
testpaths = ["tests"]
